version: "3.9"

# ---------------------------------------------------------------------------
# Stack local do Motor de Antifraude — versão inicial.
# Por enquanto só sobe a infra (Postgres + Redis) pra gente já ir
# desenvolvendo em cima. Os serviços de aplicação ficam comentados
# abaixo, como referência do que vamos usar — descomentem conforme
# cada um for ganhando código de verdade (e um Dockerfile próprio).
# ---------------------------------------------------------------------------

services:

  postgres:
    image: postgres:16-alpine
    container_name: antifraude-postgres
    environment:
      POSTGRES_USER: antifraude
      POSTGRES_PASSWORD: antifraude
      POSTGRES_DB: antifraude_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: antifraude-redis
    ports:
      - "6379:6379"

  # -------------------------------------------------------------------------
  # Serviços de aplicação (definidos no Stack Tecnológico, ainda sem código).
  # Cada um vai precisar de uma pasta própria com um Dockerfile quando
  # o time começar a escrever a aplicação.
  # -------------------------------------------------------------------------

  # scoring-service:
  #   build: ./services/scoring-service      # Python 3.12 + FastAPI
  #   ports:
  #     - "8001:8000"
  #   depends_on:
  #     - postgres
  #     - redis

  # quarantine-service:
  #   build: ./services/quarantine-service    # Python 3.12 + FastAPI (orquestrador SAGA)
  #   ports:
  #     - "8002:8000"
  #   depends_on:
  #     - postgres
  #     - redis
  #     - scoring-service

  # notification-service:
  #   build: ./services/notification-service  # Node.js + NestJS
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - redis

  # admin-panel:
  #   build: ./services/admin-panel           # React + TypeScript + Tailwind
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - quarantine-service

volumes:
  postgres_data:
